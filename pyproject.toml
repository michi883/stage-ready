[project]
name = "stage-ready"
version = "0.2.0"
readme = "README.md"
description = "An agentic video-quality loop for self-recorded content. OpenCV 5 does the seeing; an agent does the deciding."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []          # demo mode is standard library only

[project.optional-dependencies]
# Live measurement (`python3 -m stage_ready measure`, `--live`) is pinned to the versions every
# fixture was measured with. OpenCV 5 is a hard requirement — stage_ready.vision refuses 4.x.
live = ["opencv-python==5.0.0.93", "numpy==2.4.6"]
aws = ["boto3==1.43.98"]   # Full transitive pins: requirements/aws.txt

[project.urls]
Repository = "https://github.com/michi883/stage-ready"
Demo = "https://d4nh99blf9f5j.cloudfront.net/"

[project.scripts]
stage-ready = "stage_ready.__main__:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stage_ready*"]
namespaces = false
