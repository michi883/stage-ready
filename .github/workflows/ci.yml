name: Submission checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test without optional dependencies
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Install pinned build tools
        run: python -m pip install -r requirements/build.txt
      - name: Build source archive and wheel
        run: python -m build --no-isolation
      - name: Install and smoke-test wheel away from checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/stage-ready" run brian_padded ethel zach sandy
          "$RUNNER_TEMP/wheel-venv/bin/python" -c 'from stage_ready.server import WEB; assert (WEB / "index.html").is_file()'
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: stage-ready-distributions
          path: dist/

  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/headless.txt -r requirements/aws.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
